<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agrave+Pro:wght@100..700&family=Isometra&display=swap" rel="stylesheet">
    <title>Restaurant</title>
</head>
<body>
    <div id="topbar">
        <img id="logo" src="./Images/image.png">
        <h1 class="text_fancy">Dibbo Dhaba</h1>
        <div id ="navbar">
            <div class="Bubble_button" style="background: none;">Home</div>
            <div class="Bubble_button" style="background: none;">Menu</div>
            <div class="Bubble_button" style="background: none;">About</div>
            <div class="Bubble_button" style="background: none;">Locations</div>
            <div class="Bubble_button" style="background: none;">FAQ</div>
            <div class="gg-search" ></div>
            <div class="gg-shopping-cart"></div>
            <div class ="gg-profile"></div>
        </div>
    </div>
    <hr color="grey">
    <div>
        <div class="profile">
            <img src="./Images/ninja_hattori.png" height="" width="200px" class="pfp">
            <div class="text_fancy">Ninja Hattoti</div>
            <div class="text">Ninjahattori@egavillage.com</div>
            <div  class="button" class="text" id="pts" style="color: gold;" >Loyalty Points : 2468</div>
        </div>
        <div class="menubar">
            <div class="alignshit">
                <div class="gg-menu"></div>
                <div>Dashboard</div>
            </div>
                <div>
                    <div class="gg-menu-hotdog"></div>
                    <div>Order Menu</div>
                </div>
                <div>
                    <div class="gg-shopping-cart"></div>
                    <div>My Orders</div>
                </div>
                <div>
                    <div class="gg.pin"></div>
                    <div>Address</div>
                </div>
                <div>
                    <div class="gg-credit-card"></div>
                    <div>Payment Methods</div>
                </div>
                <div>
                    <div class="gg-bell"></div>
                    <div>Notifications</div>
                </div>
                <div>
                    <div class="gg-gift"></div>
                    <div>Rewards & Offers</div>
                </div>
        </div>
        <hr width="300px" align="left">
        <div class="menubar">
            <div class="gg-profile"></div>
            <div>Account Settings</div>
            <div class="gg-log-out"></div>
            <div style="color: red;">Log Out</div>
        </div>
    </div>
</body>
</html>
